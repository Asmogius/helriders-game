name: Android build

# Every push to main: import, run the headless smoke test, export a debug APK
# (and a Windows build), and publish them to the rolling "latest-build" release
# so they can be installed straight from a phone or a PC.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  # A signed release APK is built too once these repository secrets exist:
  # ANDROID_RELEASE_KEYSTORE_BASE64 (the .keystore file, base64), and
  # ANDROID_RELEASE_KEY_ALIAS / ANDROID_RELEASE_KEY_PASSWORD. Without them
  # only the debug APK is built, as before.
  HAS_RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot/releases/download/${TAG}"
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${TAG}_linux.x86_64" ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}

      - name: Put Godot on PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Stamp build number
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          sed -i "s/^config\/version=.*/config\/version=\"${VERSION}\"/" project.godot
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${VERSION}\"/" export_presets.cfg
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::Script errors during import"; exit 1
          fi

      - name: Smoke test
        run: |
          godot --headless --fixed-fps 60 --path . -s res://tests/smoke_test.gd 2>&1 | tee smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then
            echo "::error::Script errors during smoke test"; exit 1
          fi

      - name: Garage and economy test
        run: |
          godot --headless --fixed-fps 60 --path . -s res://tests/garage_test.gd 2>&1 | tee garage.log
          if grep -q "SCRIPT ERROR" garage.log; then
            echo "::error::Script errors during garage test"; exit 1
          fi

      - name: Comms and mission types test
        run: |
          godot --headless --fixed-fps 60 --path . -s res://tests/missions_test.gd 2>&1 | tee missions.log
          if grep -q "SCRIPT ERROR" missions.log; then
            echo "::error::Script errors during missions test"; exit 1
          fi

      - name: Crew test
        run: |
          godot --headless --fixed-fps 60 --path . -s res://tests/crew_test.gd 2>&1 | tee crew.log
          if grep -q "SCRIPT ERROR" crew.log; then
            echo "::error::Script errors during crew test"; exit 1
          fi

      - name: Art sheet test
        run: |
          godot --headless --path . -s res://tests/art_sheet_test.gd 2>&1 | tee art.log
          if grep -q "SCRIPT ERROR" art.log || ! grep -q "art_sheet_test: PASS" art.log; then
            echo "::error::Art sheet test failed"; exit 1
          fi

      - name: Content art test
        run: |
          godot --headless --path . -s res://tests/art_content_test.gd 2>&1 | tee art_content.log
          if grep -q "SCRIPT ERROR" art_content.log || ! grep -q "art_content_test: PASS" art_content.log; then
            echo "::error::Content art test failed"; exit 1
          fi

      - name: Configure Android export
        run: |
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres 2>/dev/null | head -n 1)
          if [ -z "$SETTINGS" ]; then
            mkdir -p ~/.config/godot
            SETTINGS=~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          {
            echo "export/android/android_sdk_path = \"${ANDROID_HOME:-$ANDROID_SDK_ROOT}\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
            echo "export/android/debug_keystore = \"${GITHUB_WORKSPACE}/ci/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"
          echo "Using $SETTINGS"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/helriders.apk 2>&1 | tee export.log
          if [ ! -s build/helriders.apk ]; then
            echo "::error::APK was not produced"; exit 1
          fi
          ls -lh build/helriders.apk

      - name: Export signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          godot --headless --path . --export-release "Android" build/helriders-release.apk 2>&1 | tee export-release.log
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          if [ ! -s build/helriders-release.apk ]; then
            echo "::error::Release APK was not produced"; exit 1
          fi
          ls -lh build/helriders-release.apk

      # The Windows build rides along; if it ever fails, the APK still ships.
      - name: Export Windows build
        continue-on-error: true
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/helriders.exe 2>&1 | tee export-windows.log
          if [ ! -s build/windows/helriders.exe ]; then
            echo "::warning::Windows build was not produced"; exit 1
          fi
          (cd build/windows && zip -q ../helriders-windows.zip helriders.exe)
          ls -lh build/helriders-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: helriders-${{ env.APP_VERSION }}
          path: |
            build/helriders*.apk
            build/helriders-windows.zip
          if-no-files-found: warn

      - name: Publish to the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          FILES=$(ls build/helriders*.apk build/helriders-windows.zip 2>/dev/null)
          gh release create latest-build $FILES \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build ${APP_VERSION}" \
            --notes "Build ${APP_VERSION} from commit ${GITHUB_SHA::7}. Android: download helriders.apk below and open it to install. Windows: download helriders-windows.zip, unzip it and run helriders.exe (Windows may warn about an unknown publisher: More info, then Run anyway)."
